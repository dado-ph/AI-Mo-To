<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>AI-Mo-To</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; background: #111827; color: #f9fafb; }
      main { max-width: 880px; margin: auto; padding: 48px 28px; }
      h1 { margin: 0 0 8px; font-size: 2.1rem; } p { color: #cbd5e1; line-height: 1.5; }
      button { border: 0; border-radius: 8px; background: #38bdf8; color: #082f49; cursor: pointer; font: inherit; font-weight: 700; padding: 11px 16px; }
      button:hover { background: #7dd3fc; } .status { min-height: 24px; color: #bae6fd; }
      .workspace { border-left: 3px solid #38bdf8; margin: 24px 0; padding-left: 16px; }
      .views { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
      article { border: 1px solid #334155; border-radius: 12px; background: #172033; padding: 20px; }
      article h2 { margin-top: 0; } .empty { color: #94a3b8; font-style: italic; }
      .error { color: #fecaca; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI-Mo-To</h1>
      <p>Open a local workspace to review its trusted state and installed modules.</p>
      <button id="open-workspace" type="button">Open workspace</button>
      <p id="status" class="status" role="status"></p>
      <section id="workspace" class="workspace" hidden></section>
      <section id="views" class="views" aria-label="Workspace views"></section>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
