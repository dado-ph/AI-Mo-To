<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <title>AI-Mo-To Workspace</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    button, input { font: inherit; color: inherit; }
    
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* Top Navigation Header */
    .header {
      align-items: center;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      height: 52px;
      padding: 0 var(--aimoto-space-md);
      gap: var(--aimoto-space-md);
    }

    .brand {
      align-items: center;
      display: flex;
      gap: var(--aimoto-space-xs);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .brand-logo {
      align-items: center;
      background: linear-gradient(135deg, var(--primary), #30a971);
      border-radius: var(--radius);
      color: #062016;
      display: flex;
      font-size: 0.85rem;
      font-weight: 900;
      height: 26px;
      justify-content: center;
      width: 26px;
    }

    .workspace-btn {
      align-items: center;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      gap: var(--aimoto-space-xs);
      padding: var(--aimoto-space-2xs) var(--aimoto-space-sm);
      font-size: 0.82rem;
      transition: background 0.15s ease;
    }
    .workspace-btn:hover { background: var(--aimoto-raised-hover); }

    .header-actions {
      display: flex;
      gap: var(--aimoto-space-xs);
      margin-left: auto;
      align-items: center;
    }

    .btn {
      align-items: center;
      background: var(--primary);
      color: var(--primary-foreground);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      font-weight: 600;
      font-size: 0.82rem;
      gap: var(--aimoto-space-xs);
      padding: 6px var(--aimoto-space-md);
      transition: opacity 0.15s ease;
    }
    .btn:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--aimoto-raised-hover); }

    /* Main Grid Layout */
    .main-body {
      display: grid;
      grid-template-columns: 240px 1fr;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: var(--aimoto-space-sm);
      gap: var(--aimoto-space-2xs);
    }

    .nav-label {
      color: var(--aimoto-subtle);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin: var(--aimoto-space-sm) var(--aimoto-space-xs) var(--aimoto-space-2xs);
      text-transform: uppercase;
    }

    .module-nav { display: flex; flex-direction: column; gap: var(--aimoto-space-2xs); }

    .nav-item {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: var(--radius);
      color: var(--aimoto-muted);
      cursor: pointer;
      display: flex;
      gap: var(--aimoto-space-xs);
      padding: 8px var(--aimoto-space-sm);
      font-size: 0.85rem;
      text-align: left;
      width: 100%;
      transition: all 0.15s ease;
    }
    .nav-item:hover { background: var(--aimoto-raised-hover); color: var(--foreground); }
    .nav-item.active { background: var(--accent); color: var(--accent-foreground); font-weight: 600; }

    .sidebar-foot {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: var(--aimoto-space-sm);
    }

    .authority-badge {
      align-items: center;
      display: inline-flex;
      font-size: 0.78rem;
      gap: var(--aimoto-space-xs);
      padding: var(--aimoto-space-2xs) var(--aimoto-space-xs);
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-foreground);
      border: 1px solid var(--border);
    }
    .authority-dot {
      background: var(--primary);
      border-radius: 50%;
      height: 7px;
      width: 7px;
    }

    /* Content Area */
    .content {
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: var(--aimoto-space-lg);
      gap: var(--aimoto-space-md);
    }

    .content-head h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
    .content-head p { color: var(--aimoto-muted); font-size: 0.85rem; margin: var(--aimoto-space-2xs) 0 0; }

    .views-grid {
      display: grid;
      gap: var(--aimoto-space-md);
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .view-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--aimoto-space-md);
      box-shadow: var(--aimoto-shadow-sm);
    }
    .view-card h2 { font-size: 0.95rem; margin: 0 0 var(--aimoto-space-xs); }
    .view-card p { color: var(--aimoto-muted); font-size: 0.82rem; margin: 0; }

    .app-frame {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: calc(100vh - 220px);
      min-height: 480px;
      width: 100%;
    }

    /* Bottom Interactive Terminal Drawer */
    .terminal-drawer {
      background: #090b0e;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 220px;
      transition: height 0.2s ease;
    }
    .terminal-drawer.collapsed {
      height: 36px;
    }

    .terminal-bar {
      align-items: center;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      height: 36px;
      padding: 0 var(--aimoto-space-md);
      gap: var(--aimoto-space-sm);
    }
    .terminal-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--aimoto-muted);
    }
    .terminal-toggle {
      background: transparent;
      border: 0;
      color: var(--aimoto-muted);
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: auto;
      padding: 2px var(--aimoto-space-xs);
    }
    .terminal-toggle:hover { color: var(--foreground); }

    .terminal-view {
      color: #f3f5f7;
      flex: 1;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      overflow: auto;
      padding: var(--aimoto-space-xs) var(--aimoto-space-md);
      white-space: pre-wrap;
    }
    .term-line { margin: 0; }
    .term-prompt { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">A</span>
        <span>AI-Mo-To</span>
      </div>
      <button id="open-workspace" class="workspace-btn" type="button">
        <span id="workspace-name">Default Workspace</span>
        <span style="color:var(--aimoto-muted)">⌄</span>
      </button>
      <div class="header-actions">
        <button id="refresh" class="btn btn-secondary" type="button">↻ Refresh</button>
        <button id="request-outcome" class="btn" type="button">+ Request Outcome</button>
      </div>
    </header>

    <!-- Main Navigation Body -->
    <div class="main-body">
      <aside class="sidebar">
        <div class="nav-label">Workspace Modules</div>
        <nav id="module-nav" class="module-nav">
          <button class="nav-item active" data-filter="all" type="button">⌂ Overview</button>
          <button class="nav-item" data-filter="files" type="button">□ Files</button>
          <button class="nav-item" data-filter="tasks" type="button">✓ Tasks</button>
        </nav>
        <div class="sidebar-foot">
          <div class="authority-badge">
            <span class="authority-dot"></span>
            <span id="authority-label">Observe mode</span>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-head">
          <h1 id="page-heading">Workspace Overview</h1>
          <p id="status" role="status">Opening local workspace…</p>
        </div>
        <section id="views" class="views-grid"></section>
      </main>
    </div>

    <!-- Bottom Interactive PTY Terminal Drawer -->
    <aside id="terminal-drawer" class="terminal-drawer">
      <div class="terminal-bar">
        <span class="authority-dot"></span>
        <span class="terminal-title">Terminal Console (PTY)</span>
        <button id="terminal-toggle" class="terminal-toggle" type="button" title="Toggle Terminal Drawer">▼ Minimize</button>
      </div>
      <div id="terminal-view" class="terminal-view" role="log">
        <p class="term-line"><span class="term-prompt">AI-Mo-To Interactive PTY Terminal initialized.</span> Rooted in workspace folder.</p>
      </div>
    </aside>
  </div>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
