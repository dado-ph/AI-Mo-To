name: Windows release readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install the reviewed dependency set
        run: pnpm install --frozen-lockfile
      - name: Prepare the product
        run: pnpm validate
      - name: Build the installer
        run: pnpm --filter @ai-mo-to/desktop dist
      - name: Retain the installer for human review
        uses: actions/upload-artifact@v4
        with:
          name: ai-mo-to-windows-installer
          path: apps/desktop/release/AI-Mo-To-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
