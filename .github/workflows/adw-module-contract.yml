name: ADW 1 - Module Contract Compliance

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'packages/module-host/**'
      - 'packages/module-sdk/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  module-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Module Contract Scanner
        run: node scripts/ci/scan-module-capabilities.js
