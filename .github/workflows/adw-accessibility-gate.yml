name: ADW 3 - Accessibility Gate

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/ui-primitives/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Desktop App
        run: pnpm --filter @ai-mo-to/desktop build
      - name: Validate Accessibility & Tokens
        run: node scripts/ci/validate-desktop-ui.js
