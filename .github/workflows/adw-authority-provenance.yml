name: ADW 5 - Authority & Provenance Trace

on:
  pull_request:
    paths:
      - 'packages/engine/**'
      - 'packages/protocol/**'
      - 'packages/storage/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authority-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Protocol & Engine Suites
        run: |
          pnpm --filter @ai-mo-to/protocol test
          pnpm --filter @ai-mo-to/engine test
